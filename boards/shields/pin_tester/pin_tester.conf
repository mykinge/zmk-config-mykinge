
# Power management - desactivar para debugging
CONFIG_PM=n
CONFIG_PM_DEVICE=n

# GPIO siempre activo
CONFIG_ZMK_KSCAN_GPIO_DRIVER=y

# Bluetooth conservador
CONFIG_BT_MAX_CONN=1
CONFIG_BT_CTLR_TX_PWR_PLUS_4=y

# Debouncing
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# Sleep
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# LED indicador solo con actividad
CONFIG_ZMK_ACTIVITY_LED=y
CONFIG_ZMK_ACTIVITY_LED_GPIOnum=24

# Batería baja con alerta
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
CONFIG_ZMK_LOW_BATTERY_ALERT=y
CONFIG_ZMK_LOW_BATTERY_THRESHOLD=15